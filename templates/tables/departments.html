<div class="intro-y overflow-auto lg:overflow-visible mt-5 sm:mt-0">
    {% if departments %}
    <table class="table table-report sm:mt-2">
        <thead>
            <tr>
                <th class="text-center whitespace-nowrap">NO</th>
                <th class="text-center whitespace-nowrap">NAME</th>
                <th class="text-center whitespace-nowrap">DEPARTMENT ID</th>
                <th class="text-center whitespace-nowrap">STAFFS</th>
                <th class="text-center whitespace-nowrap">ACTIONS</th>
            </tr>
        </thead>
        <tbody>
            {% for department in departments %}
            <tr class="intro-x">
                <td class="text-center whitespace-nowrap">{{ forloop.counter }}</td>

                <td class="font-medium text-center whitespace-nowrap">
                    <a href="">{{ department.name }}</a>
                </td>

                <td class="text-center whitespace-nowrap">EDEP-0{{ department.auto_id }}</td>

                <td class="text-center whitespace-nowrap">{{ department.staffs }}</td>

                <td class="table-report__action w-56">
                    <div class="flex justify-center items-center">
                        <a class="flex items-center text-warning mx-2"
                            href="{% url 'department-details' department.slug %}">
                            <i data-lucide="eye" class="w-4 h-4 mx-2"></i>
                        </a>

                        <a class="flex items-center mx-2" href="{% url 'department-edit' department.slug %}">
                            <i data-lucide="edit" class="w-4 h-4 mx-2"></i>
                        </a>

                        {% if department.staffs == 0 %}
                        <a class="flex items-center text-danger mx-2"
                            href="{% url 'department-delete' department.slug %}"
                            onclick="return confirm('Are you sure you want to delete the department ?');">
                            <i data-lucide="trash-2" class="w-4 h-4 mx-2"></i>
                        </a>
                        {% endif %}
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="intro-y col-span-12 overflow-auto 2xl:overflow-visible mt-5">
        <table class="table table-report -mt-2">
            <tbody>
                <tr class="intro-x width">
                    <td class=" width" style="width:100%;">
                        <i data-lucide="hard-drive"
                            style="width:60px; height:60px; margin-left: auto; margin-right: auto; display: block; padding: 10px; border-radius: 50%;"
                            class="w-6 h-6 mr-2 text-white bg-success">
                        </i>
                        <div style="text-align: center;">No data available!</div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    {% endif %}
</div>
